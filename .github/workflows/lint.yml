name: Run code linter

on: [push, pull_request]

# Cancel any preceding run on the pull request.
concurrency:
  group: lint-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/criu-dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
    - name: Install tools
      run: sudo dnf -y install git make python3-flake8 xz clang-tools-extra which codespell git-clang-format ShellCheck

    - uses: actions/checkout@v2

    - name: Set git safe directory
      # https://github.com/actions/checkout/issues/760
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Run make lint
      run: make lint

    - name: Run make indent
      run: >
        if [ -z "${{github.base_ref}}" ]; then
          git fetch --deepen=1 &&
          while read -r line; do
            FILE=$(echo $line | awk '{print $1}')
            LINE=$(echo $line | awk '{print $2}')
            echo "::warning file=$(FILE),line=$(LINE)::{Possible indent problem}"
          done <<< make indent OPTS=--diff | grep "^diff --git\|@@" | paste -d " " - -  | awk '{print $3 " " $6}' | sed 's/a\(\S*\)\s-\(.*\),.*/\1 \2/'
        else
          git fetch origin ${{github.base_ref}} &&
          while read -r line; do
            FILE=$(echo $line | awk '{print $1}')
            LINE=$(echo $line | awk '{print $2}')
            echo "::warning file=$(FILE),line=$(LINE)::{Possible indent problem}"
          done <<< make indent OPTS=--diff BASE=origin/${{github.base_ref}} | grep "^diff --git\|@@" | paste -d " " - -  | awk '{print $3 " " $6}' | sed 's/a\(\S*\)\s-\(.*\),.*/\1 \2/'
        fi
